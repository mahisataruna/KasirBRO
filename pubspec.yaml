name: kasirbro
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # state management
  provider: ^6.1.5
  # database
  sqflite: ^2.4.2
  path: ^1.9.1
  # format
  intl: ^0.20.2
  # storage
  # shared_preferences: ^2.5.3
  # ui
  google_fonts: ^6.3.1
  # icon
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - lib/assets/logo/

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "lib/assets/logo/logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/logo/logo.png"
